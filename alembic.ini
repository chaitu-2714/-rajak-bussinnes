# Alembic configuration for BizPilot AI.
# The application also runs migrations programmatically at startup
# (app.core.database.Database.initialize), so this file exists mainly for
# command line use:  alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Leave blank so app.core.config supplies the real location of bizpilot_ai.db.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
